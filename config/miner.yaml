  - path: /health/registry
    external_path: /health/registry
    method: GET
    description: >
      Product and catalog endpoint for the DegenLens application, NOT an
      intent target: do not route ONCHAIN_TX_LOOKUP, WALLET_BALANCE_CHECK or
      FRAUD_DETECTION here.
      Health of every attributed operator's wallet claims. Distinguishes an
      address that is genuinely quiet in the window from one that is dormant,
      and from one that has NO transfer history at all — a wrong label rather
      than an operator with no volume. Consumers should treat figures for
      non-reportable operators as absent, not zero.
      REQUEST: query param ?hours=168
      RESPONSE: {"operators_attributed": 4, "operators_reportable": 2,
