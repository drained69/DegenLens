version: "1"
kind: miner
id: 10002                   # assigned for DegenMiner; must remain unique
slug: degenlens-onchain
protocol: generic
name: DegenMiner Evidence-Backed On-Chain Gambling Intelligence
description: >
  DegenMiner is an evidence-first Telegraph Protocol intelligence miner for
  agents, analysts, investigators, compliance teams, and automated workflows
  that need structured information about observable on-chain activity connected
  to crypto gambling operators. It queries supported EVM networks for canonical
  transaction receipts, native balances, token and native-asset transfers,
  timestamps, counterparties, contract inputs, gas data, and current wallet
  holdings. These direct chain observations are joined to a versioned public
  attribution registry in which every operator-wallet claim records its chain,
  role, source, evidence status, review date, and confidence ceiling. The miner
  then applies deterministic and reproducible calculations to produce bounded
  intelligence about attributed operator inflows and outflows, net directional
  flow, transfer counts, unique counterparties, network and asset composition,
  large transfers, time-series activity, counterparty concentration, observable
  treasury holdings, infrastructure-provider exposure, cross-operator wallet
  overlap, player-candidate settlement patterns, attribution candidates, label
  health, and explainable anomaly indicators. Its three canonical Telegraph
  intents are ONCHAIN_TX_LOOKUP for verifiable transaction and attributed-flow
  analysis, WALLET_BALANCE_CHECK for balances, holdings, wallet associations,
  and observable settlement exposure, and FRAUD_DETECTION for deterministic
  risk triage based on patterns such as round trips, unusual velocity, and
  clustered behavior. Results are intended for investigation, monitoring, due
  diligence, market research, attribution review, and risk prioritization; they
  are not final legal, compliance, identity, credit, or enforcement decisions.
  Every inference response exposes a normalized confidence score from 0 to 1, a
  concise verdict, human-readable reasoning, data_source provenance, timestamps,
  coverage status, and endpoint-specific caveats. Confidence expresses the
  strength of support for the returned answer, not certainty about a person,
  operator, wager, or offense. It is reduced when attribution is unverified,
  pagination is incomplete, an upstream provider is unavailable, or a conclusion
  is derived rather than directly observed. Live, registry, derived, unavailable,
  and local-development demo data are explicitly distinguished; production is
  configured to reject synthetic data. Multi-chain and multi-wallet reads are
  bounded by declared lookback, pagination, concurrency, cache, circuit-breaker,
  and request-deadline controls so failures return an honest low-confidence
  unavailable result instead of fabricated values. DegenMiner never treats an
  unattributed operator, unsupported chain, failed provider read, or incomplete
  traversal as zero activity. It also does not claim access to private casino or
  sportsbook ledgers, individual bets, game outcomes, account balances held
  inside an operator, customer identity, beneficial ownership, operator revenue,
  liabilities, profitability, solvency, or proof of criminal fraud. An inbound
  or outbound transfer alone does not prove a deposit, withdrawal, wager, win,
  loss, ownership relationship, source of funds, or user intent.

# The combined DegenLens deployment serves both the web UI and miner API.
base_url: https://degenlensv1.up.railway.app

docs:
  website: https://degenlensv1.up.railway.app
  documentation: https://degenlensv1.up.railway.app/docs
  repository: https://github.com/drained69/DegenLens

# The API is publicly accessible and requires no credentials. Declaring
# `type: none` explicitly tells the node not to inject auth headers or query
# parameters when forwarding requests.
auth:
  type: none

# ── Operational envelope ─────────────────────────────────────────────────────
# Declared honestly: the node enforces these, and overpromising causes timeouts
# that count as failed answers.
rate_limit_per_sec: 8
cache_ttl_sec: 300
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  description: >
    Endpoint requests are intentionally small and deterministic. Transaction
    lookup accepts a canonical EVM transaction hash and chain. Operator flow
    endpoints accept a registry slug and lookback hours. Wallet, player, and
    anomaly endpoints accept a 0x-prefixed EVM address, chain, and optional
    lookback. Aggregate GET endpoints accept bounded query parameters. See each
    endpoint description for its exact request shape and default window. The
    live chain index is ethereum, base, polygon, arbitrum, optimism, bsc,
    avalanche, solana, tron, and bitcoin. EVM reads use Alchemy; non-EVM native
    transfer reads use configured Solana JSON-RPC, TronGrid, and Esplora
    endpoints. Availability also depends on reviewed wallet attribution,
     upstream health, token pricing, pagination limits, and the requested
     lookback window.
  properties:
    slug:
      type: string
      description: "Casino identifier, e.g. 'stake' or 'shuffle'. See GET /casinos."
      examples: ["stake", "shuffle"]
    address:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
      description: "EVM wallet address to trace or screen."
      examples: ["0x974caa59e49682cda0ad2bbe82983419a2ecc400"]
    chain:
      type: string
      enum: [ethereum, base, polygon, arbitrum, optimism, bsc, avalanche, solana, tron, bitcoin]
      default: ethereum
    hours:
      type: integer
      minimum: 1
      maximum: 720
      default: 24
      description: "Lookback window in hours."
    tx_hash:
      type: string
      pattern: "^0x[a-fA-F0-9]{64}$"
      description: "Canonical EVM transaction hash."

output_schema:
  type: object
  required: [confidence, verdict, reasoning, data_source]
  properties:
    confidence:
      type: number
      minimum: 0
      maximum: 1
      description: >
        Confidence for the returned answer, not certainty about an operator,
        person, wager, or criminal act. It is 0 when data is unavailable and
        is capped when attribution is curated, coverage is partial, or the
        result is derived from transfers rather than a direct chain fact.
    verdict:
      type: string
      description: >
        Short label. net_inflow|net_outflow for operator flow; normal|suspicious|
        critical for fraud screening (the legacy alias of risk_tier, retained for
        existing consumers); the casino slug or 'unlabeled' for wallet traces;
        the transaction status for lookups; 'invalid_input' when a request failed
        validation before any chain read was attempted.
    reasoning:
      type: string
      description: "Human-readable explanation of how the verdict was reached."
    data_source:
      type: string
      enum: [live, demo, unavailable, registry, derived]
      description: "Provenance of the figures in this response."
    coverage_complete:
      type: boolean
      description: >
        Whether the requested traversal completed within the available chain
        and pagination budget. False means reported totals are partial or lower
        bounds, not that omitted activity did not occur.
    caveat:
      type: string
      description: "Endpoint-specific limitation that consumers should preserve."
    deposits_usd:
      type: number
      description: "USD value of inbound transfers observed in the window."
    withdrawals_usd:
      type: number
      description: "USD value of outbound transfers observed in the window."
    net_flow_usd:
      type: number
    unique_depositors:
      type: integer
    transaction_count:
      type: integer
    balance_native:
      type: number
      description: "Native token balance for a traced address."
    associations:
      type: array
      description: "Casino clusters an address has interacted with in 30 days."
      items:
        type: object
        properties:
          casino_slug: { type: string }
          casino_name: { type: string }
          interactions_30d: { type: integer }
          cluster_confidence: { type: number }
    score:
      type: number
      minimum: 0
      maximum: 1
      description: "Anomaly prioritization score. Higher means more evidence requires review."
    risk_tier:
      type: string
      enum: [insufficient_data, low_risk, elevated_risk, high_risk]
      description: >
        Canonical risk label. insufficient_data means the window could not be
        characterised — too few transfers, or a provider that did not answer. It
        is NOT a clean result and never sets is_suspicious. No tier asserts that
        fraud occurred; the vocabulary stops at review priority deliberately,
        because the miner observes settlement and cannot see intent or identity.
    risk_score:
      type: number
      minimum: 0
      maximum: 1
      description: >
        Bounded, deterministic sum of the screens that fired. Same upstream
        state always yields the same score.
    is_suspicious:
      type: boolean
      description: >
        True exactly when risk_tier is elevated_risk or high_risk. Derived from
        the tier so the boolean, the tier, and the score cannot disagree.
    signals:
      type: array
      items: { type: string }
      description: "Named screens that fired, each with its measurement."
    risk_signals:
      type: array
      description: >
        Every screen that ran, fired or not, each with severity, score,
        measurement, and evidence identifiers. A screen that did not fire still
        reports what it measured.
      items:
        type: object
        properties:
          name: { type: string }
          severity: { type: string, enum: [info, low, medium, high] }
          score: { type: number }
          measurement: { type: string }
          evidence:
            type: array
            items: { type: string }
    native_balance_wei:
      type: [string, "null"]
      description: >
        Native balance in exact base units, as a string. Null — never 0 — when
        the provider could not be read. A float at wei scale is lossy:
        999999999999999999 round-trips to a whole unit.
    block_number:
      type: [integer, "null"]
      description: "Block height the balance or transaction read reflects."
    balance_status:
      type: string
      enum: [observed, unavailable]
    association_scan_status:
      type: string
      enum: [complete, not_completed_in_budget]
      description: >
        Whether the derived 30-day operator-interaction scan finished. Not
        completed means missing coverage, not zero interactions.

endpoints:
  - path: /transaction/lookup
    external_path: /transaction/lookup
    method: POST
    description: >
      Canonical transaction lookup by chain and transaction hash. Returns direct
      RPC facts: status (confirmed, reverted, or pending — all distinguishable
      from not_found), block number, block hash, block timestamp, transaction
      index, nonce, sender, recipient, native value in wei and human units with
      the native symbol, gas limit, gas used, effective gas price, total fee,
      deployed contract address, method id, calldata, and ERC-20 transfers
      decoded from the receipt logs with contract, symbol, decimals, and exact
      raw amounts. Where token decimals are unknown the raw amount is returned
      and the scaled amount is null rather than assuming 18 decimals. Operator
      attribution is a separately labelled layer; a missing registry match is
      returned as unattributed, not as proof that the transaction has no
      gambling relationship. Accepts tx_hash, txHash, hash, transaction_hash, or
      transactionHash.
      REQUEST: {"tx_hash": "0x...", "chain": "ethereum"}

  - path: /casino/stats
    external_path: /casino/stats
    method: POST
    description: >
      Measures observed inbound and outbound transfer volume, unique inbound
      counterparties, transaction count, chains, and net directional flow around
      a reviewed operator wallet cluster. This is a settlement-rail observation,
      not a wager, revenue, deposit, withdrawal, or profit-and-loss feed.
      REQUEST: {"slug": "stake", "hours": 24}
      RESPONSE: {"slug": "stake", "deposits_usd": 2672237.51,
      "withdrawals_usd": 772038.14, "net_flow_usd": 1900199.37,
      "unique_depositors": 308, "transaction_count": 408, "confidence": 0.93,
      "verdict": "net_inflow", "reasoning": "...", "data_source": "live"}

  - path: /casino/ranking
    external_path: /casino/ranking
    method: GET
    description: >
      Ranks only operators with attributed wallet coverage by observed inbound
      USD transfer flow. Includes tracked-flow share, counterparties, outbound
      flow, and confidence. Catalogued operators without reviewed attribution are
      excluded from the ranking and remain visible through /casinos and /coverage.
      REQUEST: query param ?hours=168
      RESPONSE: {"window_hours": 168, "count": 2, "ranking": [{"rank": 1,
      "slug": "stake", "deposits_usd": 24567436.62, "market_share_pct": 66.53,
      "unique_depositors": 3077}], "confidence": 0.9, "verdict": "leader:stake",
      "reasoning": "...", "data_source": "live"}

  - path: /wallet/trace
    external_path: /wallet/trace
    method: POST
    description: >
      Direct balance facts for one address, plus a separately labelled
      attribution layer. The balance is the answer: exact native balance in base
      units (native_balance_wei, a string to preserve precision) and in human
      units, the native asset symbol, the block the read reflects, and ERC-20
      token balances with contract, symbol, decimals, and both raw and scaled
      amounts. A provider failure returns null with balance_status
      "unavailable" and confidence 0 — never a zero balance, which is
      indistinguishable from a genuinely empty wallet and is wrong. Registry
      attribution and the 30-day operator-interaction scan are derived context,
      run on their own budget, and never delay or displace the balance; when the
      scan does not finish it reports association_scan_status
      "not_completed_in_budget", which is missing coverage, not an observation of
      zero interactions. Attribution is a reviewed ownership claim about an
      address; an address is not a person and an interaction does not establish
      gambling intent. Also served at /wallet/balance.
      REQUEST: {"address": "0x974caa...c400", "chain": "ethereum"}
      RESPONSE: {"address": "0x974caa59e49682cda0ad2bbe82983419a2ecc400",
      "chain": "ethereum", "block_number": 25832082, "native_symbol": "ETH",
      "native_balance_wei": "1431585373632929230863",
      "native_balance": 1431.5853736329292, "token_balances": [{"contract":
      "0xdac17f958d2ee523a2206206994597c13d831ec7", "symbol": "USDT",
      "decimals": 6, "raw_balance": "1500000", "balance": 1.5}],
      "token_count": 1, "balance_status": "observed", "labeled_casino": "stake",
      "associations": [{"casino_slug": "stake", "interactions_30d": 6482,
      "cluster_confidence": 0.75}], "association_scan_status": "complete",
      "confidence": 0.75, "verdict": "stake", "reasoning": "...",
      "data_source": "live"}

  - path: /anomaly/check
    external_path: /anomaly/check
    method: POST
    description: >
      Deterministic risk triage for one address. Runs five named screens —
      round-trip return, transfer velocity, counterparty concentration, dust
      fan-in, and repeated identical amounts — and reports each screen's
      MEASUREMENT whether or not it fired, so a low-risk answer is backed by the
      same numbers a high-risk one would be. Known exchange, bridge, DEX-router
      and attributed-operator counterparties are identified and mitigate the
      screens that ordinary settlement trips by construction; round trips with
      them are excluded from the score and reported separately. risk_tier is the
      canonical label and is one of insufficient_data, low_risk, elevated_risk,
      high_risk. An address with too few transfers to characterise is
      insufficient_data, never low_risk — unmeasured coverage is not a clean
      result. This is review prioritization from observable transfer patterns; it
      is never a finding of fraud, an identity decision, or an enforcement result,
      and no tier asserts that an offence occurred.
      REQUEST: {"address": "0x974caa...c400", "chain": "ethereum", "hours": 24}
      RESPONSE: {"address": "0x974caa59e49682cda0ad2bbe82983419a2ecc400",
      "chain": "ethereum", "window_hours": 24, "risk_tier": "low_risk",
      "risk_score": 0.0, "is_suspicious": false, "verdict": "normal",
      "risk_signals": [{"name": "round_trip_return", "severity": "info",
      "score": 0.0, "measurement": "0 of 332 outbound transfers returned...",
      "evidence": []}], "signals_fired": [], "screens_run": 5,
      "transfers_analyzed": 1231, "inbound_transfers": 899,
      "outbound_transfers": 332, "distinct_counterparties": 831,
      "top_counterparty_share_pct": 31.2, "round_trip_count": 0,
      "peak_hourly_transfers": 96, "mean_hourly_transfers": 55.83,
      "infrastructure_counterparties": [{"address": "0x28c6...", "label":
      "Binance 14", "category": "exchange"}], "coverage_complete": true,
      "confidence": 0.85, "reasoning": "...", "data_source": "live"}

  - path: /casinos
    external_path: /casinos
    method: GET
    description: >
      Public registry of catalogued gambling operators, reviewed wallet claims,
      evidence status, supported chains, and explicit attributed versus unobserved
      coverage. This is the discovery endpoint for understanding what other
      flow endpoints can actually measure.
      REQUEST: no parameters
      RESPONSE: {"count": 2, "casinos": [{"slug": "stake", "name": "Stake.com",
      "licensed_in": "Curaçao", "wallet_count": 2, "chains": ["ethereum"]}]}

  - path: /market/networks
    external_path: /market/networks
    method: GET
    description: >
      Observed flow split by chain across attributed operator clusters.
      REQUEST: query param ?hours=168
      RESPONSE: {"window_hours": 168, "chains": [{"chain": "ethereum",
      "inbound_usd": 3391190.0, "outbound_usd": 1582479.0,
      "share_of_observed_inbound_pct": 100.0, "transfers": 1606}],
      "confidence": 0.55, "verdict": "lead_chain:ethereum", "reasoning": "...",
      "data_source": "live"}

  - path: /market/assets
    external_path: /market/assets
    method: GET
    description: >
      Asset composition of observed flow. Optional ?slug= scopes it to one
      operator. Reports stablecoin share, a genuine behavioural signal.
      REQUEST: query params ?hours=168&slug=stake
      RESPONSE: {"assets": [{"symbol": "USDC", "inbound_usd": 2028000.0,
      "share_of_observed_inbound_pct": 59.9, "is_stablecoin": true}],
      "stablecoin_share_pct": 82.0, "confidence": 0.55, "verdict":
      "top_asset:USDC", "reasoning": "...", "data_source": "live"}

  - path: /market/large-transfers
    external_path: /market/large-transfers
    method: GET
    description: >
      Individual transfers above a USD threshold touching an attributed
      cluster. Each row is one verifiable transaction hash.
      REQUEST: query params ?hours=24&min_usd=100000&limit=50
      RESPONSE: {"count": 6, "transfers": [{"tx_hash": "0xb93d31...",
      "chain": "ethereum", "operator_slug": "rollbit", "direction": "inbound",
      "token": "USDC", "usd_value": 600001.0, "timestamp": "..."}],
      "confidence": 0.55, "verdict": "6_transfers_above_threshold",
      "reasoning": "...", "data_source": "live"}

  - path: /operator/{slug}/series
    external_path: /operator/{slug}/series
    method: GET
    description: >
      Bucketed inbound/outbound flow series for one operator. Unattributed
      operators return verdict "not_attributed" with confidence 0 — explicitly
      unobserved rather than zero.
      REQUEST: path slug, query params ?hours=168&bucket_hours=4
      RESPONSE: {"slug": "stake", "points": 42, "series": [{"t": "...",
      "inbound_usd": 722098.0, "outbound_usd": 19.0, "transfers": 435}],
      "confidence": 0.55, "verdict": "42_buckets", "reasoning": "...",
      "data_source": "live"}

  - path: /operator/{slug}/counterparties
    external_path: /operator/{slug}/counterparties
    method: GET
    description: >
      Counterparty concentration for an operator. High top-10 share indicates
      routing or bridge activity rather than broad user behaviour.
      REQUEST: path slug, query params ?hours=168&top=20
      RESPONSE: {"slug": "stake", "distinct_counterparties": 719,
      "top10_share_of_observed_flow_pct": 77.03, "counterparties":
      [{"address": "0x6f53...", "total_usd": 425999.0,
      "share_of_observed_flow_pct": 30.52}], "confidence": 0.55,
      "reasoning": "...", "data_source": "live"}

  - path: /coverage
    external_path: /coverage
    method: GET
    description: >
      What the miner can and cannot see. Distinguishes attributed operators
      (produce figures) from catalogued-but-unobserved ones (produce nothing,
      never a zero). Consumers should weight all other figures through this.
      REQUEST: no parameters
      RESPONSE: {"operators_catalogued": 22, "operators_attributed": 5,
      "operators_unattributed": 17, "wallet_clusters": 6, "chains_covered":
      ["ethereum"], "caveat": "...", "confidence": 1.0, "data_source": "registry"}

  - path: /player/evaluate
    external_path: /player/evaluate
    method: POST
    description: >
      Evaluate one address against every attributed operator cluster. Returns
      value sent to and received from operators, net position, per-operator
      exposure, and a behavioural classification (individual_candidate,
      one_directional, infrastructure, operator_wallet, low_activity).
      Net position is settlement direction, NOT gambling profit and loss —
      balances held inside an operator are invisible and non-wager flows such as
      affiliate payouts are indistinguishable from winnings.
      REQUEST: {"address": "0x...", "chain": "ethereum", "hours": 720}
      RESPONSE: {"address": "0x...", "sent_to_operators_usd": 316881.0,
      "received_from_operators_usd": 316879.0, "net_position_usd": -2.0,
      "transfers_with_operators": 3, "operators_touched": 1, "exposures": [...],
      "entity_class": "individual_candidate", "behaviour_flags": [...],
      "confidence": 0.5, "verdict": "net_negative", "reasoning": "...",
      "data_source": "live"}

  - path: /players/leaderboard
    external_path: /players/leaderboard
    method: GET
    description: >
      Counterparties ranked by net observed position across attributed operator
      clusters, derived from settlement rather than scraped bet feeds. Only
      addresses showing bidirectional flow are ranked; one-directional and
      infrastructure addresses are classified out and reported separately.
      REQUEST: query params ?hours=168&limit=25&include_infrastructure=false
      RESPONSE: {"addresses_observed": 4717, "class_counts": {...},
      "individual_candidates": 3, "one_directional_excluded": 1147,
      "infrastructure_excluded": 10, "net_positive": [...], "net_negative": [...],
      "largest_one_directional": [...], "methodology": "...", "confidence": 0.55,
      "data_source": "live"}

  - path: /attribution/discover/{slug}
    external_path: /attribution/discover/{slug}
    method: GET
    description: >
      Propose candidate sibling wallets for an already-attributed operator,
      ranked by on-chain evidence (bidirectional cluster flow, counterparty
      overlap, hub shape, transfer cadence). Returns a REVIEW QUEUE — behaviour
      consistent with an operator wallet never proves ownership, and nothing is
      added to the registry automatically.
      REQUEST: path slug, query params ?hours=720&limit=10
      RESPONSE: {"slug": "stake", "counterparties_examined": 3326,
      "candidates": [{"address": "0x...", "strength": 0.45,
      "recommended_status": "unverified_seed", "review_required": true,
      "evidence": {...}, "signals": [...]}], "confidence": 0.6,
      "verdict": "6_candidates_0_strong", "reasoning": "...",
      "data_source": "derived"}

  - path: /attribution/discover
    external_path: /attribution/discover
    method: GET
    description: >
      Run candidate discovery across every attributed operator at once.
      REQUEST: query params ?hours=720&per_operator=5
      RESPONSE: {"operators_expanded": 5, "candidates_proposed": 24,
      "strong_candidates": 0, "by_operator": [...], "confidence": 0.6,
      "reasoning": "...", "data_source": "derived"}

  - path: /operator/{slug}/treasury
    external_path: /operator/{slug}/treasury
    method: GET
    description: >
      Current on-chain holdings across an operator's attributed clusters —
      native balance plus ERC20 token balances, priced to USD with an asset
      breakdown. Balances, not flow. NOT a solvency statement: player
      liabilities are off-chain and unattributed wallets are invisible.
      REQUEST: path slug
      RESPONSE: {"slug": "stake", "total_usd": 8693715.0,
      "stablecoin_share_pct": 0.0, "distinct_assets": 1,
      "holdings": [{"symbol": "ETH", "amount": 4577.66, "usd_value": 8693669.0,
      "share_pct": 100.0}], "wallets": [...], "confidence": 0.55,
      "verdict": "reserves:8693715", "reasoning": "...", "data_source": "live"}

  - path: /market/treasury
    external_path: /market/treasury
    method: GET
    description: >
      All attributed operators ranked by observed on-chain reserves, with
      stablecoin share and share of observed reserves.
      REQUEST: no parameters
      RESPONSE: {"operators": [{"rank": 1, "slug": "stake",
      "total_usd": 8693715.0, "share_of_observed_reserves_pct": 99.79}],
      "total_observed_usd": 8711612.0, "operators_read": 5, "confidence": 0.55,
      "verdict": "leader:stake", "reasoning": "...", "data_source": "live"}

  - path: /market/providers
    external_path: /market/providers
    method: GET
    description: >
      Infrastructure providers ranked by casino flow carried, with rising and
      falling trend versus the prior equal window. These are the bridges,
      exchange hot wallets, and routing contracts that move value in and out of
      operator wallets. NOT game providers — a wager settles inside an
      operator's ledger and leaves no on-chain record attributing it to a game
      studio, so game-provider ranking is not derivable from chain data.
      REQUEST: query params ?hours=168&limit=25
      RESPONSE: {"ranked": [{"address": "0x...", "label": "Binance 14",
      "category": "exchange", "flow_usd": 22816040.0, "trend": "falling",
      "change_pct": -18.2, "operators_served": 1,
      "share_of_rail_flow_pct": 59.99}], "trending": [...], "categories": [...],
      "confidence": 0.55, "verdict": "top_rail:Binance 14", "data_source": "live"}

  - path: /players/cohorts
    external_path: /players/cohorts
    method: GET
    description: >
      Value segments, new-versus-returning retention, and flow concentration
      across every observed counterparty. Broader than the net-position board:
      it covers all addresses, not only those with a round trip.
      REQUEST: query param ?hours=168
      RESPONSE: {"addresses_active": 4426, "new_this_period": 2535,
      "returning": 1891, "retention_pct": 42.72, "segments": [{"segment": "mega",
      "addresses": 7, "share_of_gross_pct": 76.0}], "concentration":
      {"top_10_share_pct": 79.2}, "confidence": 0.55, "data_source": "live"}

  - path: /players/overlap
    external_path: /players/overlap
    method: GET
    description: >
      Addresses transacting with more than one attributed operator — a shared
      audience signal. Overlap is a floor, not a customer count: one person may
      use several addresses.
      REQUEST: query param ?hours=168
      RESPONSE: {"addresses_observed": 4426, "multi_operator_addresses": 12,
      "overlap_pct": 0.27, "operator_pairs": [{"operator_a": "stake",
      "operator_b": "rollbit", "shared_addresses": 8, "jaccard_pct": 0.19}],
      "confidence": 0.55, "data_source": "live"}

  - path: /health/registry
    external_path: /health/registry
    method: GET
    description: >
      Health of every attributed operator's wallet claims. Distinguishes an
      address that is genuinely quiet in the window from one that is dormant,
      and from one that has NO transfer history at all — a wrong label rather
      than an operator with no volume. Consumers should treat figures for
      non-reportable operators as absent, not zero.
      REQUEST: query param ?hours=168
      RESPONSE: {"operators_attributed": 4, "operators_reportable": 2,
      "by_attribution_status": {"healthy": 1, "partial": 1, "stale": 2},
      "dead_labels": [], "operators": [...], "confidence": 0.9,
      "verdict": "2/4_reportable", "data_source": "live"}

  - path: /health/operator/{slug}
    external_path: /health/operator/{slug}
    method: GET
    description: >
      Wallet-claim health for one operator, per address: lifetime activity,
      last-seen timestamp, and a status of active, quiet, dormant, or dead.
      REQUEST: path slug, query param ?hours=168
      RESPONSE: {"slug": "stake", "attribution_status": "partial",
      "coverage_quality": "partial", "active_claims": 1, "total_claims": 1,
      "reportable": true, "wallets": [{"address": "0x...", "status": "active",
      "lifetime_transfers": 200, "days_since_activity": 0.01}],
      "confidence": 0.9, "data_source": "live"}

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: verdict
    reason_field: reasoning
  supported_intents:
    - ONCHAIN_TX_LOOKUP
    - WALLET_BALANCE_CHECK
    - FRAUD_DETECTION

# NOTE: no `on_chain` block.
#
# DegenMiner serves pure inference over HTTP — it does not publish results into
# ERC-8183 jobs or on-chain callbacks, so the on_chain mapping is not required.
# The floor price is set in the on-chain registration transaction instead.
#
# Including a partial on_chain block would be invalid (`on_chain.transform` is
# mandatory once the block exists), and a full one adds ERC-8183 request-mapping
# surface that would have to be kept correct for no current benefit. Add it only
# if this miner later needs to be callable from a smart contract.
